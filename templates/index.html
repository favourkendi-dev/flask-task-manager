<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto max-w-3xl px-4 py-8">
        <h1 class="text-4xl font-bold text-center text-gray-800 mb-8">Task Manager</h1>
        
        <!-- Auth Section -->
        <div id="auth-section" class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6">
            <div id="login-form">
                <h2 class="text-2xl font-semibold text-gray-700 mb-4">Login</h2>
                <input type="text" id="login-username" placeholder="Username" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="password" id="login-password" placeholder="Password" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="login()" 
                    class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition font-semibold">
                    Login
                </button>
                <p class="mt-4 text-center text-gray-600">
                    Don't have an account? 
                    <a href="#" onclick="showRegister()" class="text-blue-600 hover:underline">Register</a>
                </p>
            </div>
            
            <div id="register-form" class="hidden">
                <h2 class="text-2xl font-semibold text-gray-700 mb-4">Register</h2>
                <input type="text" id="register-username" placeholder="Username" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg mb-3 focus:outline-none focus:ring-2 focus:ring-green-500">
                <input type="password" id="register-password" placeholder="Password" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-green-500">
                <button onclick="register()" 
                    class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition font-semibold">
                    Register
                </button>
                <p class="mt-4 text-center text-gray-600">
                    Already have an account? 
                    <a href="#" onclick="showLogin()" class="text-blue-600 hover:underline">Login</a>
                </p>
            </div>
        </div>

        <!-- Task Section (hidden until logged in) -->
        <div id="task-section" class="hidden">
            <div class="flex justify-between items-center bg-white rounded-lg shadow-md p-4 mb-4">
                <span id="user-display" class="text-lg font-semibold text-gray-700"></span>
                <button onclick="logout()" 
                    class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition">
                    Logout
                </button>
            </div>
            
            <!-- Task Stats -->
            <div id="task-stats" class="bg-white rounded-lg shadow-md p-3 mb-4"></div>
            
            <!-- Search & Filter Bar -->
            <div class="bg-white rounded-lg shadow-md p-4 mb-4 flex flex-wrap gap-3">
                <input type="text" id="search-input" placeholder="Search tasks..." 
                    oninput="filterTasks()"
                    class="flex-1 min-w-[200px] px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <select id="filter-priority" onchange="filterTasks()"
                    class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">All Priorities</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
                <select id="filter-status" onchange="filterTasks()"
                    class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">All Status</option>
                    <option value="completed">Completed</option>
                    <option value="pending">Pending</option>
                </select>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Add New Task</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="task-title" placeholder="Title" 
                        class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="text" id="task-description" placeholder="Description" 
                        class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <select id="task-priority" 
                        class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="low">Low Priority</option>
                        <option value="medium" selected>Medium Priority</option>
                        <option value="high">High Priority</option>
                    </select>
                    <input type="date" id="task-due-date" 
                        class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button onclick="addTask()" 
                    class="mt-4 w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition font-semibold">
                    Add Task
                </button>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">My Tasks</h2>
                <div id="tasks-container" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
